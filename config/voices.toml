# Kimi Voice Hooks - Voice Presets and Aliases
#
# This file maps friendly voice names to actual voice IDs for each TTS backend.
# These presets provide a consistent interface across different backends.
#
# You can reference these presets in your config:
#   voice = "default"      # Uses the default voice for your backend
#   voice = "calm"         # Uses a calm-sounding voice
#   voice = "energetic"    # Uses an energetic voice
#
# Or use backend-specific voice IDs directly:
#   voice = "af_sky"       # VoiceMode/Kokoro voice
#   voice = "Samantha"     # macOS say voice

# ============================================================================
# Voice Presets (Backend-Agnostic Aliases)
# ============================================================================
[presets]
# Default voice for each backend
default = { voicemode = "af_sky", say = "Alex", kokoro = "af_heart", openai = "alloy" }

# Clear, professional voices - good for coding
professional = { voicemode = "af_sky", say = "Alex", kokoro = "af_sky", openai = "alloy" }

# Calm, soothing voices - good for long sessions
calm = { voicemode = "af_nicole", say = "Samantha", kokoro = "af_bella", openai = "nova" }

# Energetic, upbeat voices - good for quick tasks
energetic = { voicemode = "af_bella", say = "Victoria", kokoro = "af_heart", openai = "shimmer" }

# Deep, authoritative voices - good for announcements
authoritative = { voicemode = "am_adam", say = "Fred", kokoro = "am_onyx", openai = "onyx" }

# Soft, gentle voices - good for quiet environments
soft = { voicemode = "af_river", say = "Vicki", kokoro = "af_bella", openai = "fable" }

# ============================================================================
